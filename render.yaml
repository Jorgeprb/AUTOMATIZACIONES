services:
  - type: web
    name: clinic-voice-agent-api
    runtime: docker
    plan: free
    dockerfilePath: ./clinic-voice-agent/Dockerfile
    dockerContext: ./clinic-voice-agent
    healthCheckPath: /health/ready
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_CALL_TRANSCRIPTION
        value: "false"
      - key: PUBLIC_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: WEBHOOK_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: MAX_WEBHOOK_BODY_BYTES
        value: "1000000"
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_PROJECT_ID
        sync: false
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2
      - key: OPENAI_REALTIME_VOICE
        value: marin
      - key: OPENAI_REALTIME_MODELS
        value: gpt-realtime-2
      - key: OPENAI_REALTIME_VOICES
        value: marin,cedar,alloy,ash,ballad,coral,echo,sage,shimmer,verse
      - key: TEST_CONSOLE_ENGINE
        value: simulator
      - key: TEST_CONSOLE_MODEL
        value: gpt-5.4-mini
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: CLINIC_TIMEZONE
        value: Europe/Madrid
      - key: CLINIC_NAME
        value: Clinica Demo
      - key: CLINIC_PHONE_NUMBER
        value: "+34910000000"
    buildFilter:
      paths:
        - clinic-voice-agent/**
        - render.yaml
