[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sip-gateway"
version = "0.1.0"
description = "Async SIP/RTP media bridge for Clinic Voice Agent."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "websockets>=14,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
    "mypy>=1.15,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sip_gateway*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
