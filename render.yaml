services:
  - type: web
    name: clinic-voice-agent-api
    runtime: docker
    dockerfilePath: ./clinic-voice-agent/Dockerfile
    dockerContext: ./clinic-voice-agent
    healthCheckPath: /health/ready
    preDeployCommand: alembic upgrade head
    dockerCommand: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_CALL_TRANSCRIPTION
        value: "false"
      - key: PUBLIC_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: WEBHOOK_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: MAX_WEBHOOK_BODY_BYTES
        value: "1000000"
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-voice-agent-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_PROJECT_ID
        sync: false
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2
      - key: OPENAI_REALTIME_VOICE
        value: marin
      - key: OPENAI_REALTIME_MODELS
        value: gpt-realtime-2
      - key: OPENAI_REALTIME_VOICES
        value: marin,cedar,alloy,ash,ballad,coral,echo,sage,shimmer,verse
      - key: TEST_CONSOLE_ENGINE
        value: simulator
      - key: TEST_CONSOLE_MODEL
        value: gpt-5.4-mini
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: CLINIC_TIMEZONE
        value: Europe/Madrid
      - key: CLINIC_NAME
        value: Clinica Demo
      - key: CLINIC_PHONE_NUMBER
        value: "+34910000000"
    buildFilter:
      paths:
        - clinic-voice-agent/**
        - render.yaml

  - type: web
    name: clinic-voice-agent-admin
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_ADMIN_API_KEY
        sync: false
      - key: VITE_ENABLE_DEV_FALLBACKS
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    buildFilter:
      paths:
        - frontend/**
        - render.yaml

databases:
  - name: clinic-voice-agent-db
    databaseName: clinic_voice_agent
    user: clinic_voice_agent
    postgresMajorVersion: "16"
    ipAllowList: []
