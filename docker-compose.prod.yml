x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    build:
      context: ./clinic-voice-agent
      args:
        INSTALL_DEV: "false"
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      PORT: "10000"
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $${PORT:-10000} --workers $${WEB_CONCURRENCY:-1} --proxy-headers --forwarded-allow-ips=*
    expose:
      - "10000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    logging: *default-logging
    mem_limit: ${API_MEM_LIMIT:-768m}

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: https://${APP_ADMIN_DOMAIN}
        VITE_ADMIN_API_KEY: ""
        VITE_ENABLE_DEV_FALLBACKS: "false"
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}

  sip-gateway:
    build:
      context: ./sip-gateway
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      BACKEND_INTERNAL_URL: http://api:10000
      HEALTH_BIND_HOST: 0.0.0.0
      HEALTH_PORT: 8088
    ports:
      - "${SIP_PORT:-6060}:${SIP_PORT:-6060}/udp"
      - "${RTP_PORT_MIN:-10000}-${RTP_PORT_MAX:-20000}:${RTP_PORT_MIN:-10000}-${RTP_PORT_MAX:-20000}/udp"
    expose:
      - "8088"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    mem_limit: ${SIP_GATEWAY_MEM_LIMIT:-512m}

  caddy:
    image: caddy:2-alpine
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      APP_ADMIN_DOMAIN: ${APP_ADMIN_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - caddy
        - validate
        - --config
        - /etc/caddy/Caddyfile
        - --adapter
        - caddyfile
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    mem_limit: ${CADDY_MEM_LIMIT:-256m}

  postgres:
    image: postgres:16-alpine
    profiles:
      - local-db
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    mem_limit: ${POSTGRES_MEM_LIMIT:-768m}

  redis:
    image: redis:7-alpine
    profiles:
      - redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    mem_limit: ${REDIS_MEM_LIMIT:-192m}

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  postgres_backups:
  redis_data:
