services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic_dev_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-clinic} -d ${POSTGRES_DB:-clinic}
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: ./clinic-voice-agent
      args:
        INSTALL_DEV: "true"
    env_file:
      - ${ROOT_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clinic}:${POSTGRES_PASSWORD:-clinic_dev_password}@postgres:5432/${POSTGRES_DB:-clinic}
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./clinic-voice-agent:/app
    user: root
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      target: development
    env_file:
      - ${ROOT_ENV_FILE:-.env}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_ADMIN_API_KEY: ${VITE_ADMIN_API_KEY:-development-only-admin-api-key}
      VITE_ENABLE_DEV_FALLBACKS: "false"
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:5173
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sip-gateway:
    build:
      context: ./sip-gateway
    env_file:
      - ${ROOT_ENV_FILE:-.env}
    environment:
      SIP_BIND_HOST: ${SIP_BIND_HOST:-0.0.0.0}
      SIP_PORT: ${SIP_PORT:-6060}
      SIP_PUBLIC_IP: ${SIP_PUBLIC_IP:-127.0.0.1}
      RTP_PORT_MIN: ${RTP_PORT_MIN:-10000}
      RTP_PORT_MAX: ${RTP_PORT_MAX:-20000}
      RTP_ADVERTISE_IP: ${RTP_ADVERTISE_IP:-127.0.0.1}
      SIP_ALLOWED_IPS: ${SIP_ALLOWED_IPS:-}
      BACKEND_INTERNAL_URL: http://app:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-development-only-internal-key}
    command:
      - python
      - -m
      - sip_gateway
    volumes:
      - ./sip-gateway:/gateway
    ports:
      - "6060:6060/udp"
      - "10000-20000:10000-20000/udp"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from sip_gateway.config import GatewaySettings; GatewaySettings(); print('ok')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  frontend_node_modules:
