name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: clinic-voice-agent
    env:
      APP_ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      INTERNAL_API_KEY: test-internal-api-key-with-32-characters
      ADMIN_API_KEY: test-admin-api-key-with-32-characters
      ADMIN_BOOTSTRAP_PASSWORD: Test-only-password-123!
      OPENAI_API_KEY: test-openai-key
      OPENAI_WEBHOOK_SECRET: test-webhook-secret
      OPENAI_PROJECT_ID: proj_test
      PUBLIC_BASE_URL: https://example.test
      FRONTEND_BASE_URL: https://admin.example.test
      GOOGLE_CLIENT_ID: test-client
      GOOGLE_CLIENT_SECRET: test-secret
      GOOGLE_REDIRECT_URI: https://example.test/auth/google/callback
      GOOGLE_TOKEN_ENCRYPTION_KEY: 8O2kjVBitzftnS456ehnuY5iSmFpJbqJNUnWVallRe4=
      CLINIC_TIMEZONE: Europe/Madrid
      CLINIC_NAME: Test
      CLINIC_PHONE_NUMBER: +34910000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: ruff check app tests
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing

  sip-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sip-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src
      - run: pytest --cov=sip_gateway --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  containers-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - run: docker compose -f docker-compose.prod.yml config >/dev/null
      - run: docker build -t autogal-api:test clinic-voice-agent
      - run: docker build -t autogal-sip:test sip-gateway
      - run: docker build -t autogal-frontend:test frontend
